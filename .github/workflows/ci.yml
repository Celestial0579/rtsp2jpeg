name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unittests und Linter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check rtsp2jpeg tests
      - run: python -m pytest -q

  integration:
    name: Integrationstest mit echter RTSP-Quelle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/integrationstest.sh

  image:
    name: Abbild bauen und veroeffentlichen
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rtsp2jpeg:latest
            ghcr.io/${{ github.repository_owner }}/rtsp2jpeg:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
