name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nur die Veroeffentlichung braucht mehr; sie bekommt es im Auftrag image.
permissions:
  contents: read

jobs:
  test:
    name: Unittests und Linter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check rtsp2jpeg tests
      - run: python -m pytest -q

  integration:
    name: Integrationstest mit echter RTSP-Quelle
    # GitHubs eigene Laeufer bringen Docker samt Compose mit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/integrationstest.sh

  image:
    name: Abbild bauen, auf main veroeffentlichen
    runs-on: ubuntu-latest
    needs: [test, integration]
    permissions:
      contents: read
      packages: write
    env:
      # Pull Requests bauen das Abbild nur (prueft das Dockerfile), sie
      # schieben nichts in die Registry. Veroeffentlicht wird allein aus
      # main -- per Push oder von Hand ueber workflow_dispatch.
      VEROEFFENTLICHEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.VEROEFFENTLICHEN == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Der Kontoname wird bei GitHub so geschrieben, wie er angelegt wurde;
      # ein Abbildname muss dagegen durchgehend klein sein.
      - name: Kontonamen kleinschreiben
        id: konto
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.VEROEFFENTLICHEN == 'true' }}
          tags: |
            ghcr.io/${{ steps.konto.outputs.name }}/rtsp2jpeg:latest
            ghcr.io/${{ steps.konto.outputs.name }}/rtsp2jpeg:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
