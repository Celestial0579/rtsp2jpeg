name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unittests und Linter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check rtsp2jpeg tests
      - run: python -m pytest -q

  integration:
    name: Integrationstest mit echter RTSP-Quelle
    # Braucht den Docker-Daemon; nur der Laeufer mit der Marke
    # docker-socket haengt den Socket ein (Laeufer 1 und 2 nicht).
    runs-on: docker-socket
    steps:
      - uses: actions/checkout@v4
      - run: scripts/integrationstest.sh

  image:
    name: Abbild bauen und veroeffentlichen
    # Braucht den Docker-Daemon; nur der Laeufer mit der Marke
    # docker-socket haengt den Socket ein (Laeufer 1 und 2 nicht).
    runs-on: docker-socket
    needs: [test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: git.firestrike.de
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Der Kontoname wird bei GitHub so geschrieben, wie er angelegt wurde;
      # ein Abbildname muss dagegen durchgehend klein sein.
      - name: Kontonamen kleinschreiben
        id: konto
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            git.firestrike.de/${{ steps.konto.outputs.name }}/rtsp2jpeg:latest
            git.firestrike.de/${{ steps.konto.outputs.name }}/rtsp2jpeg:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
