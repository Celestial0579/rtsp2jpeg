# rtsp2jpeg aus dem Internet erreichbar -- noetig, wenn die STARFACE in der
# Cloud liegt: die Anlage holt das Bild selbst ab und muss dafuer an den
# Dienst herankommen.
#
#   1. Caddyfile anpassen (Name und E-Mail-Adresse)
#   2. .env anlegen:  RTSP2JPEG_TOKEN=$(openssl rand -hex 24)
#   3. docker compose up -d
#
# In der STARFACE wird dann als Kamera-URL eingetragen:
#   https://tuerkamera.example.de/cam/tuer.jpg?token=DAS_TOKEN

services:
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "80:80"     # fuer die Zertifikatspruefung noetig
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
      - caddy-config:/config
    networks:
      intern:
        # Feste Adresse: rtsp2jpeg vertraut X-Forwarded-For nur von hier.
        ipv4_address: 172.29.80.200
    depends_on:
      - rtsp2jpeg

  rtsp2jpeg:
    image: ghcr.io/celestial0579/rtsp2jpeg:latest
    restart: unless-stopped
    # Kein "ports"-Eintrag: erreichbar ist der Dienst ausschliesslich ueber
    # Caddy. Damit gibt es keinen ungeschuetzten Weg am TLS vorbei.
    expose:
      - "8080"
    networks:
      - intern
    environment:
      CAMERA_URL: rtsp://${KAMERA_USER}:${KAMERA_PASS}@192.168.1.50:554/stream1
      CAMERA_NAME: tuer
      TOKEN: ${RTSP2JPEG_TOKEN:?RTSP2JPEG_TOKEN muss gesetzt sein}
      # Adresse von Caddy (oben): nur von dort zaehlt X-Forwarded-For.
      TRUST_PROXY: "172.29.80.200"
      # Nur Caddy darf ueberhaupt verbinden.
      ALLOW_FROM: "172.29.80.200"
      TZ: Europe/Berlin
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  intern:
    ipam:
      config:
        - subnet: 172.29.80.0/24
          # Automatisch vergeben wird nur die untere Haelfte; die feste
          # Adresse des Proxys liegt darueber und ist so nie schon belegt.
          ip_range: 172.29.80.0/25

volumes:
  caddy-daten:
  caddy-config:
