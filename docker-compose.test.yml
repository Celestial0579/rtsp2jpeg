# Testaufbau ohne echte Kamera: mediamtx spielt den RTSP-Server, ein
# ffmpeg-Testbild spielt die Tuerklingel. Gestartet wird das ueber
# scripts/integrationstest.sh.
#
# Absichtlich ohne veroeffentlichte Ports -- geprueft wird aus einem
# Container im selben Netz, damit auf dem Rechner nichts kollidiert.

services:
  rtsp-server:
    image: bluenviron/mediamtx:latest
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 2s
      timeout: 2s
      retries: 10

  test-kamera:
    build: .
    depends_on:
      rtsp-server:
        condition: service_started
    restart: unless-stopped
    entrypoint: ["/sbin/tini", "--", "sh", "-c"]
    command:
      - |
        # Wartet, bis der RTSP-Server bereit ist, und sendet dann ein
        # bewegtes Testbild -- das ersetzt die Kamera.
        sleep 3
        exec ffmpeg -hide_banner -loglevel warning \
          -re -f lavfi -i "testsrc=size=1280x720:rate=15" \
          -c:v libx264 -preset ultrafast -tune zerolatency \
          -pix_fmt yuv420p -g 30 \
          -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/tuer

  rtsp2jpeg:
    build: .
    depends_on:
      - rtsp-server
    environment:
      CAMERA_URL: rtsp://rtsp-server:8554/tuer
      CAMERA_NAME: tuer
      TOKEN: ${TEST_TOKEN:-pruef-token}
      TRUST_PROXY: "1"
      LOG_LEVEL: DEBUG
      PORT: "8080"

  # Bildet den Internet-Aufbau nach: die Anlage kommt nur ueber den
  # vorgelagerten Webserver an den Dienst heran.
  proxy:
    image: caddy:2-alpine
    depends_on:
      - rtsp2jpeg
    volumes:
      - ./tests/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
