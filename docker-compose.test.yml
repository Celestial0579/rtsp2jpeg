# Testaufbau ohne echte Kamera: mediamtx spielt den RTSP-Server, ein
# ffmpeg-Testbild spielt die Tuerklingel. Gestartet wird das ueber
# scripts/integrationstest.sh.
#
# Absichtlich ohne veroeffentlichte Ports -- geprueft wird aus einem
# Container im selben Netz, damit auf dem Rechner nichts kollidiert.

services:
  rtsp-server:
    image: bluenviron/mediamtx:1.21.4@sha256:c730bccdbc8739f8f0c13cefe9bea8b61926f599b88fa4d0d229baa91846c7bc
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 2s
      timeout: 2s
      retries: 10

  test-kamera:
    build: .
    depends_on:
      rtsp-server:
        condition: service_started
    restart: unless-stopped
    entrypoint: ["/sbin/tini", "--", "sh", "-c"]
    command:
      - |
        # Wartet, bis der RTSP-Server bereit ist, und sendet dann ein
        # bewegtes Testbild -- das ersetzt die Kamera.
        sleep 3
        exec ffmpeg -hide_banner -loglevel warning \
          -re -f lavfi -i "testsrc=size=1280x720:rate=15" \
          -c:v libx264 -preset ultrafast -tune zerolatency \
          -pix_fmt yuv420p -g 30 \
          -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/tuer

  rtsp2jpeg:
    build: .
    depends_on:
      - rtsp-server
    environment:
      CAMERA_URL: rtsp://rtsp-server:8554/tuer
      CAMERA_NAME: tuer
      TOKEN: ${TEST_TOKEN:-pruef-token}
      TRUST_PROXY: "172.29.81.200"
      LOG_LEVEL: DEBUG
      PORT: "8080"

  # Bildet den Internet-Aufbau nach: die Anlage kommt nur ueber den
  # vorgelagerten Webserver an den Dienst heran.
  proxy:
    # Gebaut statt eingehaengt -- die Begruendung steht in
    # tests/proxy/Dockerfile.
    build: ./tests/proxy
    depends_on:
      - rtsp2jpeg
    # Eingeschraenkt wie im Internet-Beispiel; ohne Zertifikate genuegt
    # fuer /data und /config ein tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        # Feste Adresse: rtsp2jpeg vertraut X-Forwarded-For nur von hier.
        ipv4_address: 172.29.81.200

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.81.0/24
          # Automatisch vergeben wird nur die untere Haelfte; die feste
          # Adresse des Proxys liegt darueber und ist so nie schon belegt.
          ip_range: 172.29.81.0/25
